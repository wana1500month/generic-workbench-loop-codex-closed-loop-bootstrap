interface:
  display_name: "Loop Control"
  short_description: "Start, inspect, resume, or stop harness runs from the right surface"
  default_prompt: "Use $loop-control for loop start, status, stop, or resume. In the Codex app, `start` means `npm run loop:start:codex -- --json` followed by immediate same-thread continuation with $attached-loop whenever attention_required = codex. Do not stop after the first Codex-owned checkpoint. Only use detached supervisor mode when the operator explicitly asks for background execution."
