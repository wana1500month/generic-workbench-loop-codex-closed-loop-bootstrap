name: Realism Positive

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/realism-positive.yml"
      - ".devcontainer/browser-validation/**"
      - "package.json"
      - "packages/loop-orchestrator/**"
      - "scripts/**"
      - "evals/verification-profiles/**"
      - ".tmp/semantic-validation/**"

jobs:
  realism-positive:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Link Chromium for harness probes
        run: |
          BROWSER_PATH="$(find /ms-playwright -path '*chrome-linux/chrome' | head -n1)"
          test -n "$BROWSER_PATH"
          ln -sf "$BROWSER_PATH" /usr/bin/chromium
          chromium --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Browser realism positive
        run: npm run validate:family-browser:positive

      - name: Editor realism positive
        run: npm run validate:family-editor:positive

      - name: Fullstack realism positive
        run: npm run validate:family-fullstack:positive

      - name: Dashboard realism positive
        run: npm run validate:family-dashboard:positive

      - name: Summarize realism-positive runs
        if: always()
        run: npm run summarize:realism-positive

      - name: Publish realism summary
        if: always()
        shell: bash
        run: |
          if [ -f evals/runs/realism-positive-summary.md ]; then
            cat evals/runs/realism-positive-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realism-positive-runs
          path: evals/runs/**
